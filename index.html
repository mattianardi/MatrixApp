
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fridge44 - AI Food Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0b10;
            color: #e5e7eb;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .gradient-border {
            position: relative;
            background: linear-gradient(to bottom right, rgba(16, 185, 129, 0.2), rgba(244, 63, 94, 0.1));
            border-radius: 1.5rem;
            padding: 1px;
        }
        .gradient-content {
            background: #0f111a;
            border-radius: calc(1.5rem - 1px);
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 10px;
        }

        @keyframes glow-blink {
            0%, 100% { 
                box-shadow: 0 0 5px rgba(245, 158, 11, 0.2);
                border-color: rgba(245, 158, 11, 0.2);
            }
            50% { 
                box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
                border-color: rgba(245, 158, 11, 0.8);
            }
        }
        .animate-glow-blink {
            animation: glow-blink 2s infinite ease-in-out;
        }

        @keyframes glow-blink-rose {
            0%, 100% { 
                box-shadow: 0 0 5px rgba(244, 63, 94, 0.2);
                border-color: rgba(244, 63, 94, 0.2);
            }
            50% { 
                box-shadow: 0 0 20px rgba(244, 63, 94, 0.6);
                border-color: rgba(244, 63, 94, 0.8);
            }
        }
        .animate-glow-blink-rose {
            animation: glow-blink-rose 1.5s infinite ease-in-out;
        }
    </style>
<script type="importmap">

</head>
